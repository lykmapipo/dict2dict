name: pre-commit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout codes
      uses: actions/checkout@v5.0.1

    - name: Setup python
      uses: actions/setup-python@v6.0.0
      with:
        python-version: "3.10"
        architecture: x64

    - name: Install dependencies
      run: make install

    - name: Run pre-commit
      uses: pre-commit/action@v3.0.1
